name = "bkst-api"
main = "src/index.js"
compatibility_date = "2026-09-08"

# One object per account, holding the PIN hash and the failed-attempt counter.
# Strongly consistent, unlike KV, which loses concurrent increments.
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account"]

[vars]
# The GitHub Pages origin allowed to call this Worker.
ALLOWED_ORIGIN = "https://varni0125.github.io"

# Secrets, set with `wrangler secret put NAME` — never in this file:
#   GOOGLE_SA_EMAIL        service account address
#   GOOGLE_SA_PRIVATE_KEY  service account private key (PEM)
#   SHEET_ID               the spreadsheet id
#   JWT_SECRET             random string used to sign login tokens

# One buffer per session. Twenty-five simultaneous check-ins become a single
# append, because Google serialises writes to one spreadsheet.
[[durable_objects.bindings]]
name = "CHECKINS"
class_name = "CheckinBuffer"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CheckinBuffer"]
