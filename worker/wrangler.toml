name = "bkst-api"
main = "src/index.js"
compatibility_date = "2026-09-08"

# Credential hashes and failed-attempt counters. Never the Sheet.
[[kv_namespaces]]
binding = "AUTH"
id = "be25308410fb483b8dd3292b8c017bab"

[vars]
# The GitHub Pages origin allowed to call this Worker.
ALLOWED_ORIGIN = "https://varni0125.github.io"

# Secrets, set with `wrangler secret put NAME` — never in this file:
#   GOOGLE_SA_EMAIL        service account address
#   GOOGLE_SA_PRIVATE_KEY  service account private key (PEM)
#   SHEET_ID               the spreadsheet id
#   JWT_SECRET             random string used to sign login tokens
